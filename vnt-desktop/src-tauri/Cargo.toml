[package]
name = "vnt-desktop"
version = "2.0.11"
description = "VNT virtual network desktop client"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "vnt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-opener = "2"
log.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rand = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
runas = "1.2.0"
windows-service.workspace = true

[features]
# tauri build（CLI）构建产物时启用 custom-protocol 使 tauri-codegen 走生产分支（内嵌前端资产）；
# 裸 cargo 构建发布产物必须显式 --features custom-protocol，否则窗口会指向 devUrl(127.0.0.1:1420)
# 且不内嵌 dist——Linux 交叉编译（cargo-xwin）即走此路径
custom-protocol = ["tauri/custom-protocol"]
